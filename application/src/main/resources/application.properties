server.servlet.application-display-name=Advanced Spring Service
spring.application.name=advanced-spring-boot-microservice
server.port=8080
server.servlet.context-path=/api

spring.threads.virtual.enabled=true

spring.jpa.open-in-view=false

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=advanced-connection-pool
spring.datasource.hikari.initialization-fail-timeout=-1

spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:25}
spring.datasource.hikari.minimum-idle=${DB_POOL_SIZE:25}

spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=5000

# Actuator
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,info,logfile

management.endpoint.health.show-components=always
management.endpoint.health.show-details=always
management.endpoint.health.group.liveness.include=ping
management.endpoint.health.group.readiness.include=*

management.endpoint.logfile.external-file=${LOG_DIR:.}/advanced.log

# App properties
app.assignments.max-batch-size=200
