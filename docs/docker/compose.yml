services:
  mysql:
    image: mysql:9.6.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  advanced-service:
    container_name: advanced-service
    image: advanced-service:${TAG}
    depends_on:
      mysql:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      DB_POOL_SIZE: 5
      JAVA_OPTS: >-
        -XX:MaxRAMPercentage=55
        -XX:MaxMetaspaceSize=128m
        -XX:ReservedCodeCacheSize=64m
        -XX:MaxDirectMemorySize=32m
        -XX:+UseSerialGC
        -Xss512k
        -XX:TieredStopAtLevel=1
      DEBUG: ${DEBUG}
      ACTIVE_PROFILE: dev
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME}?sslMode=DISABLED&allowPublicKeyRetrieval=true
      DB_USER: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8787:8787"
      - "8080:8080"
